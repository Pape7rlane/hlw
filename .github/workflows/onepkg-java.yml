name: Build OnePackage (Java)

on:
  push:
    branches: [ onepkg-java ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch base APK
        run: |
          url="${{ vars.BASE_APK_URL }}"
          test -n "$url" || { echo "缺少仓库变量 BASE_APK_URL"; exit 1; }
          python3 -c "import urllib.request,sys;urllib.request.urlretrieve(sys.argv[1],'base.apk')" "$url"

      - name: Build
        env:
          BASE_APK: ${{ github.workspace }}/base.apk
          OUT_APK: ${{ github.workspace }}/out/hlw_java.apk
          KS_BASE64: ${{ secrets.KS_BASE64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          chmod +x javasrv/build.sh inject/scripts/setup_tools.sh
          bash javasrv/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: onepkg-java-apk
          path: out/*.apk
          if-no-files-found: error
