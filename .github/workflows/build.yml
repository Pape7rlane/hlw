name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 失败时要往 ci-log 分支推日志
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Python 3.10 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log

      # 失败时把日志尾部推到一个单独的 ci-log 分支，方便外部（不用 token）读取原因
      - name: Publish failure log
        if: failure()
        run: |
          git config user.name "ci"
          git config user.email "ci@local"
          { echo "=== last 300 lines of build.log ==="; tail -n 300 build.log 2>/dev/null || echo "(no build.log)"; } > ci_error.txt
          git checkout -B ci-log
          git add -f ci_error.txt
          git commit -m "ci error log" || true
          git push -f origin ci-log || echo "push ci-log failed"

      # 把错误摘要写进 job 注解，外部（无需 token）可通过 checks API 读到
      - name: Annotate error
        if: failure()
        run: |
          MSG=$(grep -m5 -E "error:|FAILURE:|What went wrong|Caused by|Could not|Unsupported|requires" build.log 2>/dev/null | tr '\n' ' ' | cut -c1-900)
          echo "::error title=build failed::$MSG"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: huluwa-localserver-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
