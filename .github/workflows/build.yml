name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK env
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # 无论成功失败，都收集日志
      - name: Collect log
        if: always()
        run: |
          {
            echo "=== result: ${{ steps.build.outcome }} ==="
            grep -vE "^\[INFO\]|^> Task .*UP-TO-DATE|^Download" build.log 2>/dev/null | tail -n 250 || echo "(no build.log)"
          } > ci_error.txt
          echo "--- 摘要 ---"; head -40 ci_error.txt

      # 失败时把日志推到 ci-log 分支，外部可直接读取
      - name: Publish log on failure
        if: always() && steps.build.outcome != 'success'
        run: |
          git config user.name "ci"; git config user.email "ci@local"
          git checkout -B ci-log
          git add -f ci_error.txt
          git commit -m "ci log $(date -u +%H:%M:%S)" || true
          git push -f origin ci-log || echo "push failed"

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: huluwa-localserver-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail job if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
